apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-test-nginx
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: lavenderses-playground
  source:
    path: manifest/test-nginx
    repoURL: https://github.com/lavenderses/playground.git
    targetRevision: main
  syncPolicy:
    automated: {}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-argo-cd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: lavenderses-playground
  source:
    path: argocd-install/build
    repoURL: https://github.com/lavenderses/playground.git
    targetRevision: main
  syncPolicy:
    automated: {}

