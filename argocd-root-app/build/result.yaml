apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: lavenderses-playground
  source:
    path: argocd-apps/build
    repoURL: https://github.com/lavenderses/playground.git
    targetRevision: main
  syncPolicy:
    automated: {}
